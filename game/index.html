<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEXFRUIT ARENA — eat a hexfruit, master its 4 powers: 6 fruits, 7 isles, 8 corsairs, boss Captain Husk</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0714; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: Georgia, 'Times New Roman', serif; }
  #stage { position: relative; width: 1280px; height: 720px; max-width: 100vw; max-height: 100vh; }
  canvas { display: block; width: 1280px; height: 720px; background: #171029; cursor: crosshair; }
  #hud {
    position: absolute; left: 0; right: 0; top: 0; height: 44px;
    display: flex; align-items: center; gap: 20px; padding: 0 16px;
    color: #ffe9b8; font-size: 16px; letter-spacing: .03em;
    background: linear-gradient(180deg, rgba(6,3,16,.9), rgba(6,3,16,.55) 70%, rgba(6,3,16,0));
    pointer-events: none; text-shadow: 0 1px 3px #000; z-index: 3;
  }
  #hud .lab { color: #b9a8e8; font-size: 11px; text-transform: uppercase; letter-spacing: .16em; margin-right: 5px; }
  #hud .val { font-weight: bold; }
  #msg {
    position: absolute; left: 0; right: 0; bottom: 8px; text-align: center;
    color: #ffe9b8; font-size: 15px; pointer-events: none; text-shadow: 0 1px 4px #000; z-index: 3;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hud">
    <span><span class="lab">Isle</span><span class="val" id="h-isle">–</span></span>
    <span><span class="lab">Wave</span><span class="val" id="h-wave">–</span></span>
    <span><span class="lab">Fruit</span><span class="val" id="h-fruit">–</span></span>
    <span><span class="lab">Score</span><span class="val" id="h-score">0</span></span>
    <span><span class="lab">Coins</span><span class="val" id="h-coins">0</span></span>
    <span><span class="lab">Combo</span><span class="val" id="h-combo">×1.0</span></span>
    <span><span class="lab">Best</span><span class="val" id="h-best">0</span></span>
  </div>
  <div id="msg"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
